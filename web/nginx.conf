server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API i FHIR przekazywane do backendu (ten sam adres – bez problemów z CORS)
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location /fhir/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location /swagger {
    proxy_pass http://api:8080;
    proxy_set_header Host $http_host;
  }

  # Aplikacja SPA – nieznane ścieżki obsługuje router Angulara
  location / {
    try_files $uri $uri/ /index.html;
  }
}
