# Uruchomienie całego systemu jednym poleceniem:  docker compose up --build
# Aplikacja:   http://localhost:8080
# Swagger:     http://localhost:5080/swagger
# HAPI FHIR:   http://localhost:8090  (startuje ok. 1–2 minuty)

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vaxplan
      POSTGRES_USER: vaxplan
      POSTGRES_PASSWORD: vaxplan
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaxplan -d vaxplan"]
      interval: 5s
      timeout: 5s
      retries: 10

  hapi:
    image: hapiproject/hapi:v7.4.0
    ports:
      - "8090:8080"

  api:
    build: ./src/VaxPlan.Api
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      TZ: Europe/Warsaw
      ConnectionStrings__Default: "Host=db;Port=5432;Database=vaxplan;Username=vaxplan;Password=vaxplan"
      FhirServer__BaseUrl: "http://hapi:8080/fhir/"
      Jwt__Key: "docker-demo-key-change-me-0123456789abcdef"
      Cors__Origins__0: "http://localhost:8080"
    ports:
      - "5080:8080"

  web:
    build: ./web
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  db-data:
